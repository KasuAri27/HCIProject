<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识体系星空图</title>
</head>
<body>
<section id="knowledge-sphere-preview" aria-labelledby="ks-title">
  <header class="ks-header">
    <h2 id="ks-title">知识体系星空图</h2>
    <span>示例 · 微积分</span>
  </header>
  <div class="ks-sky">
    <canvas aria-label="可拖动旋转的三维知识星空图"></canvas>
    <div class="ks-labels"></div>
    <div class="ks-picker">
      <label for="ks-node">切换节点</label>
      <select id="ks-node"></select>
    </div>
    <span class="ks-progress" aria-live="polite"></span>
    <div class="ks-error" role="status" hidden></div>
  </div>
</section>
<style>
  #knowledge-sphere-preview {
    color-scheme: light dark;
    color: light-dark(#172a2a, #e5f0ef);
    background: light-dark(#fbfcfc, #181e22);
    border: 1px solid light-dark(#d9e1e0, #3a484c);
    border-radius: 16px;
    overflow: hidden;
    font: 14px/1.5 system-ui, sans-serif;
  }
  #knowledge-sphere-preview * { box-sizing: border-box; }
  #knowledge-sphere-preview [hidden] { display: none; }
  #knowledge-sphere-preview .ks-header {
    padding: 14px 18px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px;
  }
  #knowledge-sphere-preview h2 { margin: 0; font-size: 16px; font-weight: 650; }
  #knowledge-sphere-preview .ks-header span { color: light-dark(#526668, #a7b8bc); font-size: 12px; }
  #knowledge-sphere-preview .ks-sky {
    position: relative; min-width: 0; height: clamp(360px, 62vw, 540px); color: #e4f6f4;
    background: radial-gradient(ellipse at 48% 48%, #11343e 0%, #0b202c 53%, #060e1a 100%);
  }
  #knowledge-sphere-preview canvas, #knowledge-sphere-preview .ks-labels {
    position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  }
  #knowledge-sphere-preview canvas { touch-action: pinch-zoom; cursor: grab; }
  #knowledge-sphere-preview canvas:active { cursor: grabbing; }
  #knowledge-sphere-preview .ks-labels { pointer-events: none; overflow: hidden; }
  #knowledge-sphere-preview .ks-marker { position: absolute; width: 0; height: 0; white-space: nowrap; }
  #knowledge-sphere-preview .ks-number, #knowledge-sphere-preview .ks-name {
    position: absolute; left: 0; text-shadow: 0 1px 4px #03101c, 0 0 8px #03101c;
  }
  #knowledge-sphere-preview .ks-number {
    top: 0; transform: translate(-50%, -50%); color: #fbfffe;
    font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums;
  }
  #knowledge-sphere-preview .ks-name {
    top: calc(var(--node-radius) + 7px); transform: translateX(-50%);
    color: #dcefeb; font-size: 12px;
  }
  #knowledge-sphere-preview .ks-marker[data-selected="true"] .ks-name { color: #ffe5a8; }
  #knowledge-sphere-preview .ks-picker {
    position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-size: 12px;
  }
  #knowledge-sphere-preview select {
    color-scheme: dark; font: inherit; color: #d9eeed; background: #102a35;
    border: 1px solid #38525c; border-radius: 7px; min-height: 32px; padding: 4px 9px;
  }
  #knowledge-sphere-preview .ks-progress {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);
  }
  #knowledge-sphere-preview .ks-error { position: absolute; inset: 50% 0 auto; text-align: center; }
  @media (pointer: coarse) {
    #knowledge-sphere-preview select { min-height: 44px; font-size: 16px; }
  }
</style>
<script>
(async () => {
  const root = document.getElementById("knowledge-sphere-preview");
  const canvas = root.querySelector("canvas");
  const stage = root.querySelector(".ks-sky");
  const picker = root.querySelector("select");
  const labels = root.querySelector(".ks-labels");
  const progressLabel = root.querySelector(".ks-progress");
  const error = root.querySelector(".ks-error");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let THREE, renderer;
  try {
    THREE = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  } catch (cause) {
    error.textContent = "3D 场景加载失败";
    error.hidden = false;
    picker.disabled = true;
    console.error(cause);
    return;
  }
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 36);
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const centerId = 0;
  const rad = Math.PI / 180;
  const concepts = [
    ["函数", 0, 0, [], 64],
    ["极限", 43, 10, [0], 100],
    ["平均变化率", -12, -37, [0], 82],
    ["导数", 5, 7, [1, 2], 100],
    ["链式法则", 23, 54, [3, 5], 38],
    ["复合函数", 52, 102, [0], 23],
    ["单调性", -27, -9, [3], 52],
    ["极值", -52, 31, [6], 0],
    ["高阶导数", -12, 45, [3], 16],
    ["泰勒展开", -36, 96, [8], 0],
    ["连续性", 56, -76, [1], 12],
    ["定积分", 5, -91, [10], 0],
    ["微积分基本定理", -30, -108, [3, 11], 0],
    ["积分换元", -52, -66, [4, 12], 0],
    ["分部积分", -48, 150, [12, 15], 0],
    ["乘积法则", 4, 87, [3], 0],
    ["中值定理", 13, -135, [3, 10], 0],
    ["不定积分", 34, -165, [3], 0],
    ["广义积分", -16, 173, [1, 11], 0],
    ["偏导数", 37, 148, [3, 20], 0],
    ["多元函数", 4, 142, [0], 0],
    ["梯度", 58, -135, [19], 0],
    ["最优化", -19, -157, [7, 21], 0],
    ["曲线弧长", -67, -147, [11, 3], 0],
  ];
  const edges = concepts.flatMap((node, to) => node[3].map(from => [from, to]));
  const reachable = new Set();
  for (const [from, to] of edges) {
    if (concepts[from][4] === 100) reachable.add(to);
    if (concepts[to][4] === 100) reachable.add(from);
  }
  const displayName = id => concepts[id][4] > 0 || reachable.has(id) ? concepts[id][0] : "???";
  const positions = concepts.map(([, lat, lon], id) => {
    if (id === centerId) return new THREE.Vector3();
    return new THREE.Vector3(
      Math.cos(lat * rad) * Math.sin(lon * rad),
      Math.sin(lat * rad),
      Math.cos(lat * rad) * Math.cos(lon * rad),
    ).multiplyScalar(1.22);
  });

  const sphereGeometry = new THREE.SphereGeometry(1, 40, 28);
  const glassMaterial = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    vertexShader: `
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        vec4 p = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = -p.xyz;
        gl_Position = projectionMatrix * p;
      }`,
    fragmentShader: `
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        vec3 n = normalize(vN);
        vec3 v = normalize(vV);
        float rim = pow(1.0 - max(dot(n, v), 0.0), 2.7);
        vec3 key = normalize((viewMatrix * vec4(-0.55, 0.78, 0.7, 0.0)).xyz);
        vec3 fill = normalize((viewMatrix * vec4(0.64, 0.22, -0.8, 0.0)).xyz);
        float whiteGlint = pow(max(dot(n, normalize(key + v)), 0.0), 42.0);
        float blueGlint = pow(max(dot(n, normalize(fill + v)), 0.0), 24.0);
        vec3 color = vec3(0.11, 0.35, 0.46) + rim * vec3(0.15, 0.39, 0.42)
          + whiteGlint * vec3(0.8, 0.97, 1.0) + blueGlint * vec3(0.1, 0.28, 0.6);
        gl_FragColor = vec4(color, min(0.88, 0.04 + 0.59 * rim + 0.7 * whiteGlint + 0.26 * blueGlint));
        #include <colorspace_fragment>
      }`,
  });

  // Both meshes share the moving boundary, so the surface stays joined to the liquid body.
  function liquidGeometry() {
    const coordinates = [], surface = [], indices = [];
    const segments = 40, rings = 16, stride = segments + 1;
    for (const isSurface of [0, 1]) {
      const offset = surface.length;
      for (let ring = 0; ring <= rings; ring++) {
        for (let step = 0; step <= segments; step++) {
          const theta = step / segments * Math.PI * 2;
          coordinates.push(Math.cos(theta), ring / rings, Math.sin(theta));
          surface.push(isSurface);
          if (ring === rings || step === segments) continue;
          const a = offset + ring * stride + step;
          const b = a + 1, c = a + stride, d = c + 1;
          if (isSurface) indices.push(a, b, c, b, d, c);
          else indices.push(a, c, b, b, c, d);
        }
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(coordinates, 3));
    geometry.setAttribute("aSurface", new THREE.Float32BufferAttribute(surface, 1));
    geometry.setIndex(indices);
    geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1);
    return geometry;
  }
  const fluidGeometry = liquidGeometry();
  const fluidVertex = `
    attribute float aSurface;
    uniform float level;
    uniform float phase;
    uniform float energy;
    uniform float tilt;
    varying vec3 vP;
    varying vec3 vN;
    varying vec3 vV;
    varying float vSurface;
    const float radius = 0.925;
    float wave(vec2 p) {
      float a = 0.018 + 0.047 * energy;
      return a * sin(p.x * 4.2 + p.y * 3.0 - phase)
        + a * 0.62 * cos(p.y * 5.1 - p.x * 1.7 - phase * 1.42)
        + p.x * tilt + p.y * tilt * 0.28;
    }
    void main() {
      vec2 direction = position.xz;
      float rimY = clamp(level + wave(direction), -radius + 0.015, radius - 0.015);
      float rimR = sqrt(radius * radius - rimY * rimY);
      vec3 p;
      vec3 n;
      if (aSurface > 0.5) {
        vec2 uv = direction * position.y;
        float y = clamp(level + wave(uv), -radius + 0.015, radius - 0.015);
        p = vec3(uv.x * rimR, y, uv.y * rimR);
        float dx = wave(uv + vec2(0.012, 0.0)) - wave(uv - vec2(0.012, 0.0));
        float dz = wave(uv + vec2(0.0, 0.012)) - wave(uv - vec2(0.0, 0.012));
        n = normalize(vec3(-dx, 0.024 * rimR, -dz));
      } else {
        float y = mix(-radius, rimY, position.y);
        float r = sqrt(max(0.0, radius * radius - y * y));
        p = vec3(direction.x * r, y, direction.y * r);
        n = normalize(p);
      }
      vec4 view = modelViewMatrix * vec4(p, 1.0);
      vP = p;
      vN = normalize(normalMatrix * n);
      vV = -view.xyz;
      vSurface = aSurface;
      gl_Position = projectionMatrix * view;
    }`;
  const fluidFragment = `
    uniform float level;
    uniform float phase;
    uniform float energy;
    varying vec3 vP;
    varying vec3 vN;
    varying vec3 vV;
    varying float vSurface;
    void main() {
      vec3 n = normalize(vN);
      vec3 v = normalize(vV);
      vec3 key = normalize((viewMatrix * vec4(-0.48, 0.86, 0.55, 0.0)).xyz);
      float lambert = max(dot(n, key), 0.0);
      float gloss = pow(max(dot(n, normalize(key + v)), 0.0), 27.0);
      float rim = pow(1.0 - max(dot(n, v), 0.0), 2.4);
      float depth = max(0.0, level - vP.y);
      float current = sin(9.0 * vP.y + 3.0 * vP.x
        + 1.0 * sin(3.8 * vP.z + phase * 0.7) - phase * 0.55);
      vec3 deep = vec3(0.006, 0.085, 0.15);
      vec3 bright = vec3(0.017, 0.61, 0.50);
      vec3 color = mix(bright, deep, smoothstep(0.04, 1.30, depth)) * (0.51 + lambert * 0.48);
      color += vec3(0.03, 0.13, 0.16) * (current * (0.16 + 0.1 * energy) + rim * 0.56);
      if (vSurface > 0.5) {
        float currentOnTop = sin(vP.x * 11.0 + vP.z * 9.0 - phase);
        color = mix(vec3(0.035, 0.45, 0.44), vec3(0.23, 0.82, 0.65), lambert * 0.62)
          + vec3(0.03, 0.09, 0.12) * currentOnTop;
      }
      color += vec3(0.64, 0.93, 0.92) * gloss * (0.42 + vSurface * 0.53);
      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`;
  const completeMaterial = new THREE.MeshStandardMaterial({
    color: "#d7a74b", emissive: "#6e410b", emissiveIntensity: 0.28, roughness: 0.28, metalness: 0.16,
  });
  scene.add(new THREE.HemisphereLight("#c5fff3", "#173149", 1.65));
  const sun = new THREE.DirectionalLight("#fff0d3", 2.2);
  sun.position.set(-3, 5, 4);
  scene.add(sun);

  const records = positions.map((position, id) => {
    const group = new THREE.Group();
    group.position.copy(position);
    scene.add(group);
    const glass = new THREE.Mesh(sphereGeometry, glassMaterial);
    glass.userData.id = id;
    group.add(glass);
    const progress = concepts[id][4] / 100;
    let uniforms = null;
    if (progress > 0 && progress < 1) {
      // Solve the spherical-cap volume for its equilibrium liquid height.
      const level = -0.925 * 2 * Math.sin(Math.asin(1 - 2 * progress) / 3);
      uniforms = { level: { value: level }, phase: { value: 0 }, energy: { value: 0 }, tilt: { value: 0 } };
      group.add(new THREE.Mesh(fluidGeometry, new THREE.ShaderMaterial({
        uniforms, vertexShader: fluidVertex, fragmentShader: fluidFragment,
      })));
    } else if (progress === 1) {
      const liquid = new THREE.Mesh(sphereGeometry, completeMaterial);
      liquid.scale.setScalar(0.925);
      group.add(liquid);
    }
    const marker = document.createElement("div");
    marker.className = "ks-marker";
    marker.hidden = true;
    const number = document.createElement("span");
    number.className = "ks-number";
    number.textContent = `${concepts[id][4]}%`;
    const name = document.createElement("span");
    name.className = "ks-name";
    name.textContent = displayName(id);
    marker.append(number, name);
    labels.append(marker);
    return { group, glass, uniforms, marker, number };
  });
  const pickTargets = records.map(record => record.glass);

  function edgeLines(color, opacity) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
    const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
      color, transparent: true, opacity, depthWrite: false,
    }));
    lines.frustumCulled = false;
    scene.add(lines);
    return lines;
  }
  const mutedLines = edgeLines("#5c9ab6", 0.32);
  const activeLines = edgeLines("#e7c77e", 0.76);
  const stars = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++) {
    const y = 1 - 2 * (i + 0.5) / 500;
    const a = i * Math.PI * (3 - Math.sqrt(5));
    const radius = 8.0 + (i % 29) * 0.31;
    const ring = Math.sqrt(1 - y * y);
    stars.set([radius * ring * Math.cos(a), radius * y, radius * ring * Math.sin(a)], i * 3);
  }
  const starGeometry = new THREE.BufferGeometry();
  starGeometry.setAttribute("position", new THREE.BufferAttribute(stars, 3));
  scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({
    color: "#a1c9e8", size: 0.035, transparent: true, opacity: 0.62, depthWrite: false,
  })));
  for (const tilt of [0.23, 0.98, 1.82]) {
    const ring = Array.from({ length: 96 }, (_, i) => {
      const angle = i * Math.PI / 48;
      return new THREE.Vector3(Math.cos(angle) * 1.23, 0, Math.sin(angle) * 1.23)
        .applyAxisAngle(new THREE.Vector3(1, 0, 0), tilt);
    });
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ring),
      new THREE.LineBasicMaterial({ color: "#5196a7", transparent: true, opacity: 0.16, depthWrite: false })));
  }

  let selected = centerId;
  let yaw = -0.32, pitch = 0.34;
  let width = 0, height = 0;
  let frame = 0, stirredAt = -Infinity, impulse = 0;
  let drag = null;
  const screen = new THREE.Vector3();
  const edgeDirection = new THREE.Vector3();
  const edgePoint = new THREE.Vector3();

  function updateEdges() {
    let baseCount = 0, activeCount = 0;
    const base = mutedLines.geometry.attributes.position;
    const active = activeLines.geometry.attributes.position;
    for (const [a, b] of edges) {
      const related = a === selected || b === selected;
      const output = related ? active : base;
      const i = related ? activeCount : baseCount;
      edgeDirection.subVectors(positions[b], positions[a]).normalize();
      edgePoint.copy(positions[a]).addScaledVector(edgeDirection, records[a].group.scale.x);
      output.setXYZ(i, edgePoint.x, edgePoint.y, edgePoint.z);
      edgePoint.copy(positions[b]).addScaledVector(edgeDirection, -records[b].group.scale.x);
      output.setXYZ(i + 1, edgePoint.x, edgePoint.y, edgePoint.z);
      if (related) activeCount += 2;
      else baseCount += 2;
    }
    mutedLines.geometry.setDrawRange(0, baseCount);
    activeLines.geometry.setDrawRange(0, activeCount);
    base.needsUpdate = active.needsUpdate = true;
  }

  function projectLabels() {
    const adjacent = new Set(edges.filter(edge => edge.includes(selected)).flat());
    const occupied = [];
    const order = new Set([selected, centerId, ...adjacent]);
    for (const record of records) record.marker.hidden = true;
    for (const id of order) {
      const record = records[id];
      const featured = id === selected || id === centerId;
      if (!featured && (displayName(id) === "???" || camera.position.dot(positions[id]) < 0)) continue;
      screen.copy(positions[id]).project(camera);
      if (Math.abs(screen.x) > 0.95 || Math.abs(screen.y) > 0.91) continue;
      pointer.set(screen.x, screen.y);
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.intersectObjects(pickTargets, false)[0]?.object !== record.glass) continue;
      const depth = -positions[id].clone().applyMatrix4(camera.matrixWorldInverse).z;
      const radius = record.group.scale.x * height / (2 * depth * Math.tan(camera.fov * rad / 2));
      const x = (screen.x + 1) * width / 2;
      const y = (1 - screen.y) * height / 2;
      const half = displayName(id).length * 6 + 6;
      const labelY = y + radius + 7;
      if (x < half || x + half > width || labelY > height - 18 ||
        occupied.some(box => Math.abs(box.x - x) < box.half + half && Math.abs(box.y - labelY) < 17)) continue;
      occupied.push({ x, y: labelY, half });
      record.marker.style.left = `${x}px`;
      record.marker.style.top = `${y}px`;
      record.marker.style.setProperty("--node-radius", `${radius}px`);
      record.number.hidden = !featured && radius < 13;
      record.marker.hidden = false;
    }
  }

  function render(now = performance.now()) {
    if (!width || !height) return;
    const v = camera.fov * rad / 2;
    const fit = Math.min(v, Math.atan(Math.tan(v) * camera.aspect));
    const distance = 1.45 / Math.sin(fit);
    camera.position.set(
      distance * Math.cos(pitch) * Math.sin(yaw),
      distance * Math.sin(pitch),
      distance * Math.cos(pitch) * Math.cos(yaw),
    );
    camera.lookAt(0, 0, 0);
    const elapsed = Math.min(now - stirredAt, 1500);
    const energy = reducedMotion.matches ? 0 : Math.max(0, 1 - elapsed / 1500);
    for (const { uniforms } of records) {
      if (!uniforms) continue;
      uniforms.phase.value = elapsed / 125;
      uniforms.energy.value = energy;
      uniforms.tilt.value = impulse * energy * Math.cos(elapsed / 134);
    }
    renderer.render(scene, camera);
    projectLabels();
  }
  function animate(now) {
    frame = 0;
    render(now);
    if (!reducedMotion.matches && now - stirredAt < 1500) frame = requestAnimationFrame(animate);
  }
  function stir(tilt) {
    stirredAt = performance.now();
    impulse = THREE.MathUtils.clamp(tilt, -0.35, 0.35);
    if (!frame) frame = requestAnimationFrame(animate);
  }
  function select(id, orient = false) {
    selected = id;
    if (orient) {
      // Keep the selected shell node offset so that it does not cover the origin.
      yaw = id === centerId ? -0.32 : concepts[id][2] * rad - 0.55;
      pitch = id === centerId ? 0.34 : concepts[id][1] * rad + 0.26;
    }
    for (let i = 0; i < records.length; i++) {
      const radius = i === centerId ? (i === id ? 0.25 : 0.21)
        : i === id ? 0.16 : concepts[i][4] > 0 ? 0.09 : 0.058;
      records[i].group.scale.setScalar(radius);
      records[i].marker.dataset.selected = String(i === id);
    }
    picker.value = String(id);
    progressLabel.textContent = `${displayName(id)}，学习进度 ${concepts[id][4]}%`;
    updateEdges();
  }

  picker.replaceChildren(...concepts.map((_, id) => new Option(
    displayName(id) === "???" ? `未解锁节点 ${id + 1}` : displayName(id), id,
  )));
  picker.addEventListener("change", () => {
    select(Number(picker.value), true);
    stir(0.28);
  });
  canvas.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    drag = { x: event.clientX, y: event.clientY, lastX: event.clientX, yaw, pitch };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", event => {
    if (!drag || !event.isPrimary) return;
    yaw = drag.yaw - (event.clientX - drag.x) * 0.009;
    pitch = THREE.MathUtils.clamp(drag.pitch + (event.clientY - drag.y) * 0.008, -1.43, 1.43);
    stir((event.clientX - drag.lastX) * 0.03);
    drag.lastX = event.clientX;
  });
  canvas.addEventListener("pointerup", event => {
    if (!drag || !event.isPrimary) return;
    const distance = Math.hypot(event.clientX - drag.x, event.clientY - drag.y);
    drag = null;
    if (distance > 5) return;
    const bounds = canvas.getBoundingClientRect();
    pointer.set(2 * (event.clientX - bounds.left) / bounds.width - 1, 1 - 2 * (event.clientY - bounds.top) / bounds.height);
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickTargets, false)[0];
    if (!hit) return;
    select(hit.object.userData.id);
    stir(0.18);
  });
  canvas.addEventListener("lostpointercapture", () => { drag = null; });
  function resize() {
    width = stage.clientWidth;
    height = stage.clientHeight;
    if (!width || !height) return;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    render();
  }
  select(centerId);
  new ResizeObserver(resize).observe(stage);
  resize();
  root.dataset.renderer = "three-webgl";
})();
</script>
</body>
</html>
