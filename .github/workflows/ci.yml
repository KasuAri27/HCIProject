name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix scripts/frontend --ignore-scripts
      - run: python scripts/check_repo_layout.py
      - name: 全部 Python 入口检查
        run: |
          python -m ruff check app tests scripts launcher
          python -m compileall -q app tests scripts launcher
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_frontend.py
      - name: 安装固定版本密钥扫描器
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: 候选文件与完整历史密钥扫描（脱敏）
        run: python -m scripts.check_secrets --gitleaks "$RUNNER_TEMP/gitleaks" --history

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: 浏览器关键流程与运行错误门禁
        run: python -m unittest discover -s tests/browser -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: .uitest/browser/
          retention-days: 7

  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/integration -p test_external_tools.py -k Ocr -v

  # 保留 main 已要求的名称；任何子门禁失败、取消或跳过都不能放行。
  checks:
    name: checks
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, windows, browser, ocr]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 所有代码质量门禁必须成功
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -m scripts.check_ci_results

  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 拉取比较基准
        if: ${{ env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000' }}
        run: git fetch --no-tags origin "$BASE_SHA" || true
      - name: 检查提交信息
        if: github.event_name != 'workflow_dispatch'
        run: python scripts/check_commit_messages.py
      - name: 检查 PR 标题与分支
        if: github.event_name == 'pull_request'
        run: python -m scripts.check_pr_metadata
