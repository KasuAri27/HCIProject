name: Office integration

# 只在维护者手动选择的可信 ref 上运行，不向自托管 Office 发送任意 PR 代码。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office:
    runs-on: [self-hosted, Windows, office]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pywin32
      - run: python -m unittest discover -s tests/integration -p test_external_tools.py -k Office -v
