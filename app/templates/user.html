{% extends "pages_base.html" %}
{% block title %}读者档案{% endblock %}
{% block crumb %}读者档案{% endblock %}

{% block content %}
<section class="user-ledger">
  <div class="user-plate">
    <div class="user-identity">
      <div class="avatar-column">
        <div class="profile-avatar" id="profile-avatar">
          <img id="profile-avatar-img" alt="" hidden>
          <span id="profile-avatar-initial" aria-hidden="true">读</span>
        </div>
        <div class="avatar-tools">
          <label class="text-btn" for="avatar-input">更换头像</label>
          <input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <button type="button" class="text-btn" id="btn-avatar-remove" hidden>移除</button>
        </div>
      </div>
      <div class="plate-copy">
        <p class="plate-label">本地档案</p>
        <h1 id="user-name">读者</h1>
        <p class="plate-goal" id="user-goal">把读过的资料，变成自己的笔记。</p>
      </div>
    </div>
    <p class="plate-note">资料、API Key 与学习记录只保存在这台电脑。</p>
  </div>
  <form class="user-form" id="profile-form">
    <label class="field">
      <span>怎么称呼你</span>
      <input id="profile-name" type="text" maxlength="40" placeholder="留空就是“读者”">
    </label>
    <label class="field">
      <span>这阵子的学习目标</span>
      <input id="profile-goal" type="text" maxlength="200" placeholder="例如：读完机器学习课件">
    </label>
    <button type="submit" class="pbtn pbtn-primary">保存档案</button>
  </form>
</section>

<section class="stat-ledger" aria-label="学习统计">
  <div class="stat-cell">
    <span class="stat-value" id="stat-docs">0</span>
    <span class="stat-label">份资料</span>
  </div>
  <div class="stat-cell">
    <span class="stat-value" id="stat-read">0</span>
    <span class="stat-label">已读</span>
  </div>
  <div class="stat-cell">
    <span class="stat-value" id="stat-notes">0</span>
    <span class="stat-label">笔记</span>
  </div>
  <div class="stat-cell">
    <span class="stat-value" id="stat-practice">0</span>
    <span class="stat-label">练习记录</span>
  </div>
</section>

<p class="page-footnote">
  想调整字号、行距或清理学习记录？去 <a href="/settings">设置</a>。
</p>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='page-user.js') }}"></script>
{% endblock %}
