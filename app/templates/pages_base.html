<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}工作台{% endblock %} · 学习助手</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body class="sheet-page page-{{ active_page }}">
  <header class="page-top">
    <a class="page-brand" href="/">学习助手</a>
    <span class="page-crumb">{% block crumb %}工作台{% endblock %}</span>
    <span class="page-grow"></span>
    <a class="page-back" href="/">回到阅读台</a>
  </header>

  <div class="sheet-shell">
    <nav class="sheet-index" aria-label="工作台导航">
      <p class="index-title">工作台</p>
      <a class="index-link{% if active_page == 'user' %} is-current{% endif %}" href="/user">用户</a>
      <a class="index-link{% if active_page == 'api' %} is-current{% endif %}" href="/api-config">API 配置</a>
      <a class="index-link{% if active_page == 'settings' %} is-current{% endif %}" href="/settings">设置</a>
      <p class="index-note">资料与学习记录都留在本机。</p>
    </nav>

    <main class="sheet-main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div class="page-toast" id="page-toast" hidden></div>
  <script src="{{ url_for('static', filename='page-common.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
